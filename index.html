<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="theme-color" content="#F2F5EF">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Kate's Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
<style>
:root{
  /* Layout: quiet sidebar of life areas + one calm column of tasks; bottom tab bar on phones */
  --bg:#F2F5EF;
  --surface:#FFFFFF;
  --surface-2:#F7F9F5;
  --ink:#26312A;
  --muted:#6B786E;
  --line:#DFE6DB;
  --accent:#5E8261;
  --on-accent:#FFFFFF;
  --sage:#8DAE89;
  --sage-soft:#E7EFE4;
  --check:#B5C4B1;
  --danger:#B0574A;
  --danger-soft:#F6E4DF;
  --shadow:0 1px 2px rgba(38,49,42,.04),0 8px 28px rgba(38,49,42,.06);
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px;border-radius:6px}
svg{display:block}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px;padding:28px 14px 20px;border-right:1px solid var(--line);background:var(--surface-2)}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px;font-family:var(--font-display);font-size:20px;font-weight:500;letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;border-radius:50%;background:var(--sage-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.brand-mark svg{width:17px;height:17px}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;transition:background .15s,color .15s}
.nav-item svg{width:19px;height:19px;flex:none}
.nav-item:hover{background:var(--sage-soft);color:var(--ink)}
.nav-item.active{background:var(--sage-soft);color:var(--accent);font-weight:600}
.badge{margin-left:auto;font-size:12px;line-height:18px;min-width:22px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--on-accent);text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.side-foot{margin-top:auto;padding:0 12px}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;min-height:18px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sage);flex:none}
.status.saving::before,.status.loading::before{background:var(--check);animation:pulse 1s ease-in-out infinite}
.status.local::before{background:var(--check)}
.status.err{color:var(--danger)}
.status.err::before{background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}

main{padding:44px 48px 120px;min-width:0}
.wrap{max-width:760px;margin:0 auto;transition:opacity .2s}
.wrap.wide{max-width:1100px}
main.is-loading .wrap{opacity:.5;pointer-events:none}
.m-status{display:none}
.m-bar{display:none}
.foot-link{display:block;margin:8px 0 0 -8px;font-size:12.5px}
.data-text{width:100%;height:160px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);resize:vertical;outline:none}
.data-text:focus{border-color:var(--sage)}
.dlg-steps{margin:0 0 14px;padding-left:20px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}

/* ---------- headings ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{margin:0 0 4px;font-size:13.5px;color:var(--muted)}
h1{margin:0;font-family:var(--font-display);font-weight:500;font-size:36px;line-height:1.1;letter-spacing:-.015em;text-wrap:balance}
.sub-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:30px 0 10px}
.head-tools{display:flex;gap:8px;align-items:center}
.progress{min-width:190px}
.progress-text{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--sage-soft);overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;background:var(--sage);border-radius:inherit;transition:width .35s ease}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.ghost:hover{border-color:var(--sage)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.danger,.link-btn.danger{color:var(--danger)}
.link-btn{font-size:13px;color:var(--muted);padding:4px 8px;border-radius:7px}
.link-btn:hover{color:var(--ink);background:var(--sage-soft)}
.link-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .12s,color .12s,opacity .12s}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{background:var(--sage-soft);color:var(--accent)}
.icon-btn.on{color:var(--accent)}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.sun-btn.on svg circle{fill:currentColor}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.pill:hover{border-color:var(--sage)}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill.danger{color:var(--danger)}
.pill input[type="date"]{border:0;background:transparent;font-size:13px;color:var(--muted);padding:0;outline:none;min-width:0}

/* ---------- task list ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:4px 0}
.list>.task+.task{border-top:1px solid var(--line)}
.row{display:flex;align-items:flex-start;gap:8px;padding:11px 12px 11px 8px}
.children{padding-left:30px}
.children .row{padding-top:7px;padding-bottom:7px}
.children>.task:last-child>.row{padding-bottom:11px}
.twisty,.twisty-sp{width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--muted);margin-top:1px;border-radius:6px}
.twisty:hover{background:var(--sage-soft)}
.twisty svg{width:14px;height:14px;transition:transform .15s}
.twisty.open svg{transform:rotate(90deg)}
.check{width:22px;height:22px;flex:none;border:1.6px solid var(--check);border-radius:7px;display:grid;place-items:center;color:transparent;margin-top:1px;transition:background .15s,border-color .15s}
.check svg{width:14px;height:14px;stroke-width:3}
.check:hover{border-color:var(--sage)}
.task.done>.row .check{background:var(--sage);border-color:var(--sage);color:#fff}
.body{flex:1;min-width:0;padding-top:1px}
.title{cursor:text;overflow-wrap:anywhere;min-height:21px}
.task.done>.row .title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--check)}
.title-input{width:100%;border:0;border-bottom:1.5px solid var(--sage);background:transparent;padding:0 0 1px;outline:none}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:12px;height:12px}
button.chip:hover{border-color:var(--sage)}
.chip.today,.chip.sun{background:var(--sage-soft);border-color:transparent;color:var(--accent)}
.chip.sun svg circle{fill:currentColor}
.chip.over{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.crumb{font-size:12.5px;color:var(--muted);margin-right:2px}
.actions{display:flex;gap:2px;flex:none;margin:-4px -2px -4px 0}
.actions .icon-btn{opacity:0}
.row:hover .actions .icon-btn,.row:focus-within .actions .icon-btn,.actions .icon-btn.on{opacity:1}
@media (hover:none){.actions .icon-btn{opacity:1}}
.due-menu,.row-menu{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px 60px}
.repeat-row{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.rep-label{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);margin-right:2px}
.rep-label svg{width:14px;height:14px}
.pill.rep-day{min-width:44px;justify-content:center;padding:6px 8px}
.children .due-menu,.children .row-menu{padding-top:2px}
.empty{padding:18px 20px;color:var(--muted);margin:0}
.add-row{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 38px;border-top:1px solid var(--line)}
.list>.add-row:first-child{border-top:0}
.children .add-row{border-top:0;padding-left:30px}
.add-plus{color:var(--accent);width:22px;height:22px;display:grid;place-items:center;flex:none}
.add-plus svg{width:16px;height:16px}
.add-input{flex:1;min-width:0;border:0;background:transparent;padding:4px 0;outline:none}
.add-input::placeholder{color:var(--muted);opacity:.85}
.list-foot{display:flex;justify-content:flex-end;margin-top:8px}

/* quick add on By EOD */
.quick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;box-shadow:var(--shadow)}
.quick .add-input{flex:1 1 220px}
.select{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--surface-2);font-size:13.5px;color:var(--ink);max-width:100%}

/* coming up */
.up{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 0}
.up-row{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 16px}
.up-row+.up-row{border-top:1px solid var(--line)}
.up-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.up-title{overflow-wrap:anywhere}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.tab{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:500;font-size:14px}
.tab svg{width:14px;height:14px}
.tab:hover{border-color:var(--sage);color:var(--ink)}
.tab.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tab-count{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
.tab.add{border-style:dashed}
.tab-form{display:inline-flex}
.tab-input{padding:6px 14px;border-radius:999px;border:1.5px solid var(--sage);background:var(--surface);outline:none;width:170px;font-size:14px}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;min-height:34px}
.list-head h2{font-family:var(--font-display);font-weight:500;font-size:23px;margin:0;letter-spacing:-.01em}
.list-tools{display:flex;gap:2px}
.rename-input{font-family:var(--font-display);font-size:22px;border:0;border-bottom:1.5px solid var(--sage);background:transparent;outline:none;padding:0 0 2px;width:min(340px,100%)}

/* overview landing page for sections with sub-tabs */
.ov-quick{margin:0 0 14px}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.ov-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px 10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ov-head{display:flex;align-items:baseline;gap:10px}
.ov-name{font-family:var(--font-display);font-size:20px;font-weight:500;text-align:left;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.ov-name:hover{color:var(--accent)}
.ov-count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ov-open{margin-left:auto;flex:none}
.ov-flags{display:flex;gap:6px;flex-wrap:wrap}
.ov-list{display:flex;flex-direction:column}
.ov-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ov-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-top:1px}
.ov-title{text-align:left;overflow-wrap:anywhere}
.ov-title:hover{color:var(--accent)}
.ov-row .chip{margin-top:2px}
.ov-row .icon-btn{margin:-4px -6px -4px -4px}
.ov-empty{color:var(--muted);font-size:14px;padding:10px 0 4px;border-top:1px solid var(--line);margin:0}
.ov-more{align-self:flex-start;margin-left:-8px}

/* ---------- athletics ---------- */
.week-bar{display:flex;align-items:center;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.week-range{font-family:var(--font-display);font-weight:500;font-size:21px;margin:0 8px;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px 8px;display:flex;flex-direction:column;gap:6px;min-height:180px}
.day.past{background:var(--surface-2)}
.day.is-today{border-color:var(--sage);box-shadow:inset 0 0 0 1px var(--sage)}
.day-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 2px}
.dow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dnum{font-family:var(--font-display);font-size:19px;font-variant-numeric:tabular-nums}
.is-today .dow,.is-today .dnum{color:var(--accent)}
.day-sess{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.sess{--c:#9AA39C;display:flex;align-items:flex-start;gap:7px;padding:7px 8px;border-radius:9px;background:color-mix(in srgb,var(--c) 15%,var(--surface));border-left:3px solid var(--c);min-width:0}
.sess-check{width:16px;height:16px;border-radius:50%;border:1.6px solid var(--c);flex:none;margin-top:2px;display:grid;place-items:center;color:transparent}
.sess-check svg{width:10px;height:10px;stroke-width:3.5}
.sess.done .sess-check{background:var(--c);color:#fff}
.sess-body{text-align:left;min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.sess-act{font-size:13px;font-weight:600;line-height:1.3}
.sess-note{font-size:12px;color:var(--muted);overflow-wrap:anywhere;line-height:1.35}
.sess.done .sess-act,.sess.done .sess-note{text-decoration:line-through;opacity:.7}
.day-add{display:flex;align-items:center;gap:4px;justify-content:center;font-size:12.5px;color:var(--muted);padding:6px;border-radius:8px;border:1px dashed var(--line)}
.day-add:hover{color:var(--accent);border-color:var(--sage);background:var(--sage-soft)}
.day-add svg{width:14px;height:14px}
.today-train{display:flex;flex-wrap:wrap;gap:8px}
.today-train .sess{flex:0 1 240px}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:12px}
.tally-card{--c:#9AA39C;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tally-top{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.tally-num{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.tally-acts{font-size:12.5px;color:var(--muted);margin-top:4px}
.tally-empty{color:var(--muted);font-size:14px;margin:12px 2px 0}
.week-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- dialogs ---------- */
.backdrop{position:fixed;inset:0;background:rgba(18,26,20,.38);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s ease}
.dialog{background:var(--surface);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.22);width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px 22px 18px}
.dialog.wide{width:min(580px,100%)}
.dialog h2{margin:0;font-family:var(--font-display);font-weight:500;font-size:23px}
.dlg-sub{margin:3px 0 18px;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.label{font-size:12.5px;font-weight:600;color:var(--muted)}
.input{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface-2);outline:none;width:100%}
.input:focus{border-color:var(--sage)}
.act-pills{display:flex;flex-wrap:wrap;gap:6px}
.act-pill{--c:#9AA39C;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;background:var(--surface)}
.act-pill:hover{border-color:var(--c)}
.act-pill.on{background:color-mix(in srgb,var(--c) 22%,var(--surface));border-color:var(--c);font-weight:600}
.dlg-actions{display:flex;gap:8px;align-items:center;margin-top:6px}
.grow{flex:1}
.dlg-text{margin:8px 0 18px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;background:var(--surface-2)}
.seg button{padding:5px 12px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;font-size:13.5px;color:var(--muted)}
.grp{--c:#9AA39C;border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px;margin-bottom:10px}
.grp-head,.act-row{display:flex;align-items:center;gap:8px}
.name-input{flex:1;min-width:0;border:1px solid transparent;border-radius:8px;padding:6px 8px;background:transparent;outline:none}
.name-input:hover{border-color:var(--line)}
.name-input:focus{border-color:var(--sage);background:var(--surface-2)}
.grp-head .name-input{font-weight:600}
.acts{display:flex;flex-direction:column;gap:2px;margin:4px 0 0 14px}
.swatch{--c:#9AA39C;width:24px;height:24px;border-radius:50%;background:var(--c);flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch.sm{width:26px;height:26px}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
.palette{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 10px 36px}
.swatch.custom{position:relative;overflow:hidden;background:conic-gradient(#C77D7D,#C9A44C,#8DAE89,#4FA3A0,#5B8DB8,#A68BC2,#C77D7D)}
.swatch.custom input{position:absolute;inset:-6px;opacity:0;cursor:pointer;width:40px;height:40px}
.mini-select{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--surface-2);font-size:13px;max-width:150px}
.grp-add{margin:4px 0 2px 14px}

/* sign-in */
.signin{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:24px}
.signin-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px 24px 20px}
.signin-card h1{font-size:30px;margin:14px 0 2px}
.signin-card .btn.primary{width:100%;justify-content:center;padding:11px;margin-top:4px}
.signin-err{color:var(--danger);font-size:13.5px;margin:-4px 0 12px}

.tabbar{display:none}
@media (min-width:761px){.mob-only{display:none !important}}
@media (max-width:1000px){

}
@media (max-width:760px){

  .tabbar .nav-item{flex-direction:column;gap:3px;padding:6px 2px;font-size:10.5px;border-radius:10px;position:relative;justify-content:center;text-align:center}
  .tabbar .nav-item svg{width:21px;height:21px}

}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

function matchesRepeat(r, ds) {
  const d = parse(ds), wd = d.getDay();

  if (r.type === 'weekdays') return wd >= 1 && wd <= 5;
  if (r.type === 'weekly') return (r.days || []).includes(wd);
  if (r.type === 'monthly') { const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); return d.getDate() === Math.min(r.dom || 1, last); }
  return false;
}
function nextOccurrence(r, fromDs) {

  return null;
}
const ordinal = n => { const sfx = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (sfx[(v - 20) % 10] || sfx[v] || sfx[0]); };

  if (!r) return '';
  if (r.type === 'daily') return 'Every day';
  if (r.type === 'weekdays') return 'Weekdays';
  if (r.type === 'monthly') return 'Monthly on the ' + ordinal(r.dom || 1);
  const ds = (r.days || []).slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7));
  if (ds.length === 7) return 'Every day';
  return 'Every ' + ds.map(d => DOW[d]).join(', ');

function setRepeat(id, val) {

  const td = today();
  const base = t.due && t.due >= td ? t.due : td;

  if (val === 'weekly') t.repeat = { type: 'weekly', days: t.repeat && t.repeat.type === 'weekly' ? t.repeat.days : [parse(base).getDay()] };

}
function toggleRepeatDay(id, day) {
  const t = S.tasks[id]; if (!t || !t.repeat || t.repeat.type !== 'weekly') return;
  const days = new Set(t.repeat.days || []);
  if (days.has(day)) { if (days.size > 1) days.delete(day); } else days.add(day);
  t.repeat = { type: 'weekly', days: Array.from(days) };
  t.due = nextOccurrence(t.repeat, today());
  queueSave('tasks');
}
// The day after a repeating task is checked off, bring it back unchecked on its next day.
function rollRecurring() {
  const td = today();
  let n = 0;
  Object.values(S.tasks).forEach(t => {
    if (!t.repeat || !t.done || !t.doneAt || t.doneAt >= td) return;
    const base = t.due && t.due > t.doneAt ? t.due : t.doneAt;
    t.due = nextOccurrence(t.repeat, addDays(base, 1));
    t.done = false; t.doneAt = null; t.eod = null;
    descendants(t.id).forEach(d => { d.done = false; d.doneAt = null; });
    n++;
  });
  if (n) queueSave('tasks');
}

/* ================= task logic ================= */
let KIDS = new Map();
function buildIndex() {
  KIDS = new Map();
  Object.values(S.tasks).forEach(t => {
    if (t.parent && S.tasks[t.parent]) {
      if (!KIDS.has(t.parent)) KIDS.set(t.parent, []);
      KIDS.get(t.parent).push(t);
    }
  });
}
const kidsOf = id => KIDS.get(id) || [];
const sortTasks = arr => arr.slice().sort((a, b) => (a.done - b.done) || (a.order - b.order));
function descendants(id) {
  const out = [], stack = [id];
  while (stack.length) { const x = stack.pop(); Object.values(S.tasks).forEach(t => { if (t.parent === x) { out.push(t); stack.push(t.id); } }); }
  return out;
}
function rootsOf(sec, subtab) {
  return Object.values(S.tasks).filter(t => (!t.parent || !S.tasks[t.parent]) && t.section === sec && (t.subtab || null) === (subtab || null));
}
function findTab(sec, id) { return (S.config.subtabs[sec] || []).find(t => t.id === id) || null; }
function isOnToday(t, td) {
  const due = (t.eod && t.eod <= td) || (t.due && t.due <= td);
  return t.done ? !!(due && t.doneAt === td) : !!due;
}
function hasTodayAncestor(t, td) {
  let p = t.parent && S.tasks[t.parent], g = 0;
  while (p && g++ < 60) { if (isOnToday(p, td)) return true; p = p.parent && S.tasks[p.parent]; }
  return false;
}
const lateRank = (t, td) => ((t.due && t.due < td) || (t.eod && t.eod < td)) ? 1 : 0;
function todayRoots() {
  const td = today();
  return Object.values(S.tasks)
    .filter(t => isOnToday(t, td) && !hasTodayAncestor(t, td))
    .sort((a, b) => (a.done - b.done) || (lateRank(b, td) - lateRank(a, td)) || (a.order - b.order));
}
function crumb(t) {
  const parts = [];
  if (t.section === 'inbox') parts.push('Just today');
  else {
    parts.push(SEC[t.section] ? SEC[t.section].name : '');
    if (t.subtab) { const tab = findTab(t.section, t.subtab); if (tab) parts.push(tab.name); }
  }
  const anc = [];
  let p = t.parent && S.tasks[t.parent], g = 0;
  while (p && g++ < 60) { anc.unshift(p.title.length > 30 ? p.title.slice(0, 29) + '…' : p.title); p = p.parent && S.tasks[p.parent]; }
  return parts.concat(anc).join(' › ');
}
function dueInfo(due) {
  const td = today();
  if (due < td) return { text: 'Overdue · ' + shortDate(due), cls: 'over' };
  if (due === td) return { text: 'Today', cls: 'today' };
  const diff = dayDiff(td, due);
  if (diff === 1) return { text: 'Tomorrow', cls: '' };
  if (diff < 7) return { text: DOW[parse(due).getDay()], cls: '' };
  return { text: shortDate(due), cls: '' };
}
function addTask(title, o) {
  title = String(title || '').trim();
  if (!title) return null;
  const t = { id: uid(), title, done: false, doneAt: null, parent: o.parent || null, section: o.section, subtab: o.subtab || null, due: o.due || null, eod: o.eod || null, order: Date.now() };
  S.tasks[t.id] = t;
  queueSave('tasks');
  return t;
}
function toggleDone(id) {
  const t = S.tasks[id]; if (!t) return;
  t.done = !t.done;
  t.doneAt = t.done ? today() : null;
  queueSave('tasks');
}
function togglePin(id) {
  const t = S.tasks[id]; if (!t) return;
  const td = today();
  if (t.eod && t.eod <= td) {
    t.eod = null;
    if (!t.done && t.due && t.due <= td && ui.view === 'today') toast('It stays here because it’s due today. Change the due date to move it.');
  } else {
    t.eod = td;
    if (ui.view !== 'today') toast('Added to By EOD');
  }
  queueSave('tasks');
}
function removeTasks(list, msg) {
  const removed = list.map(t => clone(t));
  removed.forEach(t => { delete S.tasks[t.id]; });
  queueSave('tasks');
  toast(msg, () => { removed.forEach(t => { S.tasks[t.id] = t; }); queueSave('tasks'); });
}
function deleteTask(id) {
  const t = S.tasks[id]; if (!t) return;
  const all = [t].concat(descendants(id));
  removeTasks(all, all.length > 1 ? 'Deleted task and ' + plural(all.length - 1, 'subtask') : 'Task deleted');
}
function clearDone(sec, subtab) {
  const out = new Map();
  const walk = t => {
    if (t.done) { out.set(t.id, t); descendants(t.id).forEach(d => out.set(d.id, d)); return; }
    Object.values(S.tasks).filter(k => k.parent === t.id).forEach(walk);
  };
  rootsOf(sec, subtab).forEach(walk);
  if (out.size) removeTasks(Array.from(out.values()), 'Cleared ' + plural(out.size, 'completed task'));
}
function pruneOld() {
  const cutoff = addDays(today(), -14);
  let n = 0;
  Object.values(S.tasks).forEach(t => { if (t.section === 'inbox' && t.done && t.doneAt && t.doneAt < cutoff && !t.parent) { descendants(t.id).forEach(d => delete S.tasks[d.id]); delete S.tasks[t.id]; n++; } });
  if (n) queueSave('tasks');
}

const actById = id => S.config.activities.find(a => a.id === id) || null;

  if (t.due) { const d = dueInfo(t.due); meta.push('<button class="chip ' + (t.done ? '' : d.cls) + '" data-action="due" data-id="' + t.id + '" title="Change due date">' + icon('cal') + esc(d.text) + '</button>'); }

  return anc.join(' › ');
}
function viewOverview(sec, st) {
  const td = today(), soon = addDays(td, 7);
  const cards = st.tabs.map(t => ({ id: t.id, name: t.name, tab: t.id }));
  if (st.showGeneral) cards.push({ id: GENERAL, name: 'General', tab: null });
  const targets = ui.prefs.ovTarget || {};
  let target = targets[sec];
  if (!cards.some(c => c.id === target)) target = cards[0].id;
  let h = '<form class="quick ov-quick" data-form="ov-add" data-section="' + sec + '"><span class="add-plus">' + icon('plus') + '</span>' +
    '<input id="ov-input" class="add-input" placeholder="Add a task to ' + esc(SEC[sec].name) + '" autocomplete="off" aria-label="New task">' +
    '<select id="ov-target" class="select" data-section="' + sec + '" aria-label="Sub-tab for the new task">' +
    cards.map(c => '<option value="' + c.id + '"' + (c.id === target ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') +
    '</select><button class="btn primary small" type="submit">Add</button></form>';
  h += '<div class="ov-grid">' + cards.map(c => {
    const open = Object.values(S.tasks).filter(t => t.section === sec && (t.subtab || null) === c.tab && !t.done);
    const cand = open.filter(t => t.due || !t.parent || !S.tasks[t.parent])
      .sort((a, b) => ((a.due ? 0 : 1) - (b.due ? 0 : 1)) || (a.due || '').localeCompare(b.due || '') || (a.order - b.order));
    const shown = cand.slice(0, 4);
    const over = open.filter(t => t.due && t.due < td).length;
    const week = open.filter(t => t.due && t.due >= td && t.due <= soon).length;
    let card = '<section class="ov-card"><header class="ov-head"><button class="ov-name" data-action="tab" data-tab="' + c.id + '">' + esc(c.name) + '</button>' +
      '<span class="ov-count">' + open.length + ' open</span>' +
      '<button class="link-btn ov-open" data-action="tab" data-tab="' + c.id + '" aria-label="Open ' + esc(c.name) + '">Open ›</button></header>';
    if (over || week) card += '<div class="ov-flags">' + (over ? '<span class="chip over">' + over + ' overdue</span>' : '') + (week ? '<span class="chip today">' + week + ' due this week</span>' : '') + '</div>';
    if (!shown.length) card += '<p class="ov-empty">No open tasks.</p>';
    else card += '<div class="ov-list">' + shown.map(t => {
      const pinned = !!(t.eod && t.eod <= td);

        '<div class="ov-body"><button class="ov-title" data-action="tab" data-tab="' + c.id + '">' + esc(t.title) + '</button>' + (anc ? '<span class="crumb">in ' + esc(anc) + '</span>' : '') + '</div>' +
        (d ? '<span class="chip ' + d.cls + '">' + icon('cal') + esc(d.text) + '</span>' : '') +
        '<button class="icon-btn sun-btn' + (pinned ? ' on' : '') + '" data-action="pin" data-id="' + t.id + '" title="' + (pinned ? 'Remove from By EOD' : 'Add to By EOD') + '" aria-label="' + (pinned ? 'Remove from By EOD' : 'Add to By EOD') + '">' + icon('sun') + '</button></div>';
    }).join('') + '</div>';
    if (open.length > shown.length) card += '<button class="link-btn ov-more" data-action="tab" data-tab="' + c.id + '">See all ' + open.length + ' ›</button>';
    return card + '</section>';
  }).join('') + '</div>';
  return h;
}

function viewAthletics() {
  const td = today(), ws = ui.weekStart;
  const days = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  const we = days[6];
  const thisWeek = mondayOf(td);
  const a = parse(ws), b = parse(we);
  const range = a.getMonth() === b.getMonth()
    ? MON[a.getMonth()] + ' ' + a.getDate() + '–' + b.getDate()
    : MON[a.getMonth()] + ' ' + a.getDate() + ' – ' + MON[b.getMonth()] + ' ' + b.getDate();
  const weekSess = Object.values(S.training).filter(s => s.date >= ws && s.date <= we);
  const prevHas = Object.values(S.training).some(s => s.date >= addDays(ws, -7) && s.date < ws);
  const label = ws === thisWeek ? 'This week' : ws < thisWeek ? 'Past week' : 'Coming week';
  let h = '<header class="page-head"><div><p class="eyebrow">' + label + '</p><h1>Athletics</h1></div>' +
    '<div class="head-tools"><button class="btn ghost small" data-action="open-activities">' + icon('palette') + 'Activities &amp; colors</button></div></header>';

    '<h2 class="week-range">' + range + '</h2>' +
    '<button class="icon-btn" style="opacity:1" data-action="week-next" aria-label="Next week">' + icon('chev') + '</button>' +
    (ws !== thisWeek ? '<button class="btn ghost small" data-action="week-today">Back to this week</button>' : '') + '</div>';
  h += '<div class="week">' + days.map(d => {
    const dt = parse(d);

      '<div class="day-head"><span class="dow">' + DOW[dt.getDay()] + '</span><span class="dnum">' + dt.getDate() + '</span></div>' +
      '<div class="day-sess">' + sessionsOn(d).map(sessChip).join('') + '</div>' +

  }).join('') + '</div>';

  h += '<h2 class="sub-h">Athletics to-dos</h2>' + renderList('athletics', null, 'Add a to-do, like race sign-ups or gear');
  return h;

function tally(list) {
  if (!list.length) return '<p class="tally-empty">Nothing planned this week yet. Use Add on any day to build your plan.</p>';
  const rows = new Map();
  list.forEach(s => {
    const a = actById(s.act);
    const g = a ? grpById(a.group) : null;
    const key = g ? g.id : '__other';
    if (!rows.has(key)) rows.set(key, { name: g ? g.name : 'Other', color: g ? g.color : '#9AA39C', total: 0, done: 0, acts: new Map(), order: g ? S.config.groups.indexOf(g) : 999 });
    const r = rows.get(key);
    r.total++; if (s.done) r.done++;
    const an = a ? a.name : 'Removed activity';
    r.acts.set(an, (r.acts.get(an) || 0) + 1);
  });
  return '<div class="tally">' + Array.from(rows.values()).sort((x, y) => x.order - y.order).map(r =>
    '<div class="tally-card" style="--c:' + r.color + '"><div class="tally-top"><span class="dot"></span><span>' + esc(r.name) + '</span><span class="tally-num">' + r.done + ' of ' + r.total + ' done</span></div>' +
    '<div class="tally-acts">' + Array.from(r.acts.entries()).map(e => esc(e[0]) + ' ' + e[1]).join(' · ') + '</div></div>'
  ).join('') + '</div>';
}

const READ_ONLY_OK = new Set(['collapse', 'tab', 'week-prev', 'week-next', 'week-today', 'close-modal', 'backdrop', 'confirm-no', 'more', 'due', 'open-data', 'copy-data', 'forgot', 'sign-out']);
function importData(text) {
  let d = null;
  try { d = JSON.parse(String(text || '').trim()); } catch (e) {}
  const ok = d && typeof d === 'object' && d.config && typeof d.tasks === 'object' && d.tasks;
  if (!ok) { toast('That doesn’t look like planner data. Copy it again from your old planner.'); return; }
  const tasks = {}, training = {};
  Object.values(d.tasks).forEach(t => { if (t && t.id && typeof t.title === 'string') tasks[t.id] = t; });
  Object.values(d.training || {}).forEach(x => { if (x && x.id && x.date) training[x.id] = x; });
  const nt = Object.keys(tasks).length, nw = Object.keys(training).length;
  ui.modal = { type: 'confirm', title: 'Import ' + plural(nt, 'task') + '?', text: 'This brings in ' + plural(nt, 'task') + ', ' + plural(nw, 'workout') + ', your sub-tabs and activity colors, and replaces what’s in this planner now.', yes: 'Import',
    onYes: () => { S.config = normalizeConfig(d.config); S.tasks = tasks; S.training = training; queueSave('config', 'tasks', 'training'); toast('Imported ' + plural(nt, 'task') + ' and ' + plural(nw, 'workout')); },
    onNo: () => { ui.modal = { type: 'data' }; } };
}
function exportJSON() {
  return JSON.stringify({ app: 'kates-planner', v: 1, exportedAt: new Date().toISOString(), config: S.config, tasks: S.tasks, training: S.training });
}
function copyData() {
  const ta = $('#data-text');
  const fallback = () => { if (ta) { ta.focus(); ta.select(); } toast('Text selected. Press ⌘C (or Copy) to copy it.'); renderToast(); };
  try {
    navigator.clipboard.writeText(exportJSON()).then(() => { toast('Copied. Now paste it into your new planner.'); renderToast(); }, fallback);
  } catch (e) { fallback(); }
}

document.addEventListener('click', e => {
  const navLink = e.target.closest('a.nav-item');
  if (navLink) {
    const v = navLink.getAttribute('href').slice(1);
    if (v === ui.view && SEC[v] && SEC[v].tabs) { ui.prefs.activeTab[v] = OVERVIEW; ui.renamingTab = null; ui.addingTab = false; render(); }
    return;
  }
  const el = e.target.closest('[data-action]');
  const a = el ? el.dataset.action : null;
  let changed = false;
  if (ui.dueMenu && !e.target.closest('.due-menu') && a !== 'due') { ui.dueMenu = null; changed = true; }
  if (ui.rowMenu && !e.target.closest('.row-menu') && a !== 'more') { ui.rowMenu = null; changed = true; }
  if (!el) { if (changed) render(); return; }
  if (a === 'backdrop' && e.target !== el) { if (changed) render(); return; }
  if (!canEdit() && !READ_ONLY_OK.has(a)) return;
  const id = el.dataset.id;
  switch (a) {
    case 'done': toggleDone(id); break;
    case 'ov-done': {
      const t = S.tasks[id]; if (!t) break;
      toggleDone(id);
      toast('Done: ' + (t.title.length > 40 ? t.title.slice(0, 39) + '…' : t.title), () => { const x = S.tasks[id]; if (x && x.done) { x.done = false; x.doneAt = null; queueSave('tasks'); } });
      break;
    }
    case 'pin': togglePin(id); break;
    case 'due': ui.dueMenu = ui.dueMenu === id ? null : id; ui.rowMenu = null; break;
    case 'set-due': { const t = S.tasks[id]; if (t) { t.due = el.dataset.val || null; if (!t.due) t.repeat = null; queueSave('tasks'); } ui.dueMenu = null; break; }
    case 'set-repeat': setRepeat(id, el.dataset.val); break;
    case 'repeat-day': toggleRepeatDay(id, Number(el.dataset.day)); break;
    case 'edit': ui.editing = id; ui.focus = '#edit-' + id; break;
    case 'collapse': if (ui.prefs.collapsed[id]) delete ui.prefs.collapsed[id]; else ui.prefs.collapsed[id] = 1; savePrefs(); break;
    case 'add-sub': ui.addSub = id; delete ui.prefs.collapsed[id]; savePrefs(); ui.rowMenu = null; ui.focus = '#sub-input'; break;
    case 'more': ui.rowMenu = ui.rowMenu === id ? null : id; ui.dueMenu = null; break;
    case 'delete': deleteTask(id); ui.rowMenu = null; break;
    case 'clear-done': clearDone(el.dataset.section, el.dataset.subtab || null); break;
    case 'toast-undo': { const u = ui.toast && ui.toast.undo; ui.toast = null; clearTimeout(toastTimer); if (u) u(); break; }
    case 'tab': ui.prefs.activeTab[ui.view] = el.dataset.tab; savePrefs(); ui.renamingTab = null; break;
    case 'new-tab': ui.addingTab = true; ui.focus = '#new-tab-input'; break;
    case 'rename-tab': ui.renamingTab = el.dataset.tab; ui.focus = '#rename-tab-input'; ui.selectAll = true; break;
    case 'delete-tab': {
      const sec = ui.view, tab = findTab(sec, el.dataset.tab); if (!tab) break;
      const tasks = Object.values(S.tasks).filter(t => t.section === sec && t.subtab === tab.id);
      ui.modal = { type: 'confirm', title: 'Delete “' + tab.name + '”?', text: tasks.length ? 'This also deletes its ' + plural(tasks.length, 'task') + '.' : 'This sub-tab has no tasks.', yes: 'Delete',
        onYes: () => {
          const list = S.config.subtabs[sec]; const idx = list.indexOf(tab);
          list.splice(idx, 1);
          const removed = tasks.map(t => clone(t)); removed.forEach(t => delete S.tasks[t.id]);
          queueSave('config', 'tasks');
          toast('Deleted “' + tab.name + '”', () => { S.config.subtabs[sec].splice(idx, 0, tab); removed.forEach(t => { S.tasks[t.id] = t; }); ui.prefs.activeTab[sec] = tab.id; queueSave('config', 'tasks'); });
        } };
      break;
    }
    case 'week-prev': ui.weekStart = addDays(ui.weekStart, -7); break;
    case 'week-next': ui.weekStart = addDays(ui.weekStart, 7); break;
    case 'week-today': ui.weekStart = mondayOf(today()); break;
    case 'copy-week': copyWeek(); break;
    case 'sess-add': {
      const last = ui.prefs.lastAct && actById(ui.prefs.lastAct) ? ui.prefs.lastAct : (S.config.activities[0] ? S.config.activities[0].id : null);
      ui.modal = { type: 'session', id: null, date: el.dataset.date, act: last, note: '' };
      break;
    }
    case 'sess-edit': { const s = S.training[id]; if (s) ui.modal = { type: 'session', id, date: s.date, act: s.act, note: s.note || '' }; break; }
    case 'sess-done': { const s = S.training[id]; if (s) { s.done = !s.done; queueSave('training'); } break; }
    case 'pick-act': if (ui.modal) { const n = $('#sess-note'), d = $('#sess-date'); if (n) ui.modal.note = n.value; if (d && d.value) ui.modal.date = d.value; ui.modal.act = el.dataset.act; } break;
    case 'sess-delete': {
      const s = ui.modal && S.training[ui.modal.id];
      if (s) { const copy = clone(s); delete S.training[s.id]; queueSave('training'); toast('Workout deleted', () => { S.training[copy.id] = copy; queueSave('training'); }); }
      ui.modal = null; break;
    }
    case 'open-activities': ui.modal = { type: 'activities' }; ui.colorPick = null; break;
    case 'color-by': S.config.colorBy = el.dataset.val === 'group' ? 'group' : 'activity'; queueSave('config'); break;
    case 'pick-color': { const k = el.dataset.kind + ':' + id; ui.colorPick = ui.colorPick === k ? null : k; break; }
    case 'set-color': setColor(el.dataset.kind, id, el.dataset.color); ui.colorPick = null; break;
    case 'add-activity': {
      const act = { id: uid(), name: 'New activity', color: unusedColor(S.config.activities), group: el.dataset.group || null };
      S.config.activities.push(act); queueSave('config');
      ui.focus = '#act-name-' + act.id; ui.selectAll = true; break;
    }
    case 'delete-activity': {
      const act = actById(id); if (!act) break;
      const used = Object.values(S.training).filter(s => s.act === id).length;
      const doDelete = () => { S.config.activities = S.config.activities.filter(x => x.id !== id); queueSave('config'); };
      if (!used) doDelete();
      else ui.modal = { type: 'confirm', title: 'Delete “' + act.name + '”?', text: plural(used, 'workout') + ' on your calendar use it. They’ll stay, shown in grey as “Removed activity.”', yes: 'Delete',
        onYes: () => { doDelete(); ui.modal = { type: 'activities' }; }, onNo: () => { ui.modal = { type: 'activities' }; } };
      break;
    }
    case 'add-group': {
      const g = { id: uid(), name: 'New group', color: unusedColor(S.config.groups) };
      S.config.groups.push(g); queueSave('config');
      ui.focus = '#grp-name-' + g.id; ui.selectAll = true; break;
    }
    case 'delete-group': {
      S.config.activities.forEach(x => { if (x.group === id) x.group = null; });
      S.config.groups = S.config.groups.filter(g => g.id !== id); queueSave('config'); break;
    }
    case 'open-data': ui.modal = { type: 'data' }; break;
    case 'copy-data': copyData(); return;
    case 'import-data': { const ta = $('#import-text'); importData(ta ? ta.value : ''); break; }
    case 'sign-out': doSignOut(); return;
    case 'forgot': { const em = $('#si-email'); doReset(em ? em.value : ''); return; }
    case 'close-modal': case 'backdrop': ui.modal = null; ui.colorPick = null; break;
    case 'confirm-yes': { const m = ui.modal; ui.modal = null; if (m && m.onYes) m.onYes(); break; }
    case 'confirm-no': { const m = ui.modal; ui.modal = null; if (m && m.onNo) m.onNo(); break; }
    default: return;
  }
  render();
});

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  if (f.dataset.form === 'signin') { doSignIn($('#si-email').value, $('#si-pass').value); return; }
  if (!canEdit()) return;
  const kind = f.dataset.form;
  const input = f.querySelector('input');
  if (kind === 'add') {
    if (addTask(input.value, { section: f.dataset.section, subtab: f.dataset.subtab || null })) ui.focus = '#add-input';
  } else if (kind === 'quick') {
    const target = $('#quick-target').value || 'inbox|';
    ui.prefs.quickTarget = target; savePrefs();
    const parts = target.split('|');
    const t = addTask(input.value, { section: parts[0], subtab: parts[1] || null, eod: today() });
    if (t) ui.focus = '#quick-input';
  } else if (kind === 'ov-add') {
    const sec = f.dataset.section;
    const target = $('#ov-target').value;
    ui.prefs.ovTarget = ui.prefs.ovTarget || {};
    ui.prefs.ovTarget[sec] = target; savePrefs();
    if (addTask(input.value, { section: sec, subtab: target === GENERAL ? null : target })) ui.focus = '#ov-input';
  } else if (kind === 'sub') {
    const p = S.tasks[f.dataset.parent];
    if (p && addTask(input.value, { section: p.section, subtab: p.subtab, parent: p.id })) ui.focus = '#sub-input';
  } else if (kind === 'new-tab') {
    commitNewTab(input.value);
  } else if (kind === 'rename-tab') {
    commitRename(f.dataset.tab, input.value);
  } else if (kind === 'session') {
    saveSession();
  }
  render();
});
function commitNewTab(v) {
  v = String(v || '').trim();
  ui.addingTab = false;
  if (!v || !S.config.subtabs[ui.view]) return;
  const t = { id: uid(), name: v };
  S.config.subtabs[ui.view].push(t);
  ui.prefs.activeTab[ui.view] = t.id; savePrefs();
  queueSave('config');
}
function commitRename(tabId, v) {
  v = String(v || '').trim();
  const t = findTab(ui.view, tabId);
  ui.renamingTab = null;
  if (t && v && v !== t.name) { t.name = v; queueSave('config'); }
}
function commitEdit(input, rerender) {
  const id = input.dataset.edit;
  if (ui.editing !== id) return;
  ui.editing = null;
  const t = S.tasks[id];
  const v = input.value.trim();
  if (t && v && v !== t.title) { t.title = v; queueSave('tasks'); }
  if (rerender) { render(); return; }
  const div = document.createElement('div');
  div.className = 'title'; div.dataset.action = 'edit'; div.dataset.id = id;
  div.textContent = t ? t.title : v;
  input.replaceWith(div);
}

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('title-input')) {
    if (e.key === 'Enter') { e.preventDefault(); commitEdit(t, true); }
    else if (e.key === 'Escape') { e.preventDefault(); ui.editing = null; render(); }
    return;
  }
  if (e.key !== 'Escape') return;
  if (ui.modal) { const m = ui.modal; ui.modal = null; ui.colorPick = null; if (m.onNo) m.onNo(); render(); return; }
  if (ui.dueMenu || ui.rowMenu || ui.addSub || ui.addingTab || ui.renamingTab) {
    ui.dueMenu = ui.rowMenu = ui.addSub = ui.renamingTab = null; ui.addingTab = false; render();
  }
});

document.addEventListener('focusout', e => {
  if (rendering) return;
  const t = e.target;
  if (!t || !t.matches) return;
  if (t.matches('.title-input')) commitEdit(t, false);
  else if (t.id === 'sub-input') { if (!t.value.trim()) { ui.addSub = null; softRender(); } }
  else if (t.id === 'new-tab-input') { if (ui.addingTab) { commitNewTab(t.value); softRender(); } }
  else if (t.id === 'rename-tab-input') { const f = t.closest('form'); if (ui.renamingTab) { commitRename(f && f.dataset.tab, t.value); softRender(); } }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (!canEdit()) return;
  if (t.dataset.dateFor) {
    const task = S.tasks[t.dataset.dateFor];
    if (task && t.value) { task.due = t.value; queueSave('tasks'); ui.dueMenu = null; render(); }
    return;
  }
  if (t.id === 'quick-target') { ui.prefs.quickTarget = t.value; savePrefs(); return; }
  if (t.id === 'ov-target') { ui.prefs.ovTarget = ui.prefs.ovTarget || {}; ui.prefs.ovTarget[t.dataset.section] = t.value; savePrefs(); return; }
  if (t.id === 'sess-date') { if (ui.modal && t.value) ui.modal.date = t.value; return; }
  const ch = t.dataset.change; if (!ch) return;
  const id = t.dataset.id;
  if (ch === 'group-name') { const g = grpById(id); if (g && t.value.trim()) { g.name = t.value.trim(); queueSave('config'); } softRender(); }
  else if (ch === 'act-name') { const a = actById(id); if (a && t.value.trim()) { a.name = t.value.trim(); queueSave('config'); } softRender(); }
  else if (ch === 'act-group') { const a = actById(id); if (a) { a.group = t.value || null; queueSave('config'); } render(); }
  else if (ch === 'custom-color') { setColor(t.dataset.kind, id, t.value); ui.colorPick = null; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'sess-note' && ui.modal) ui.modal.note = e.target.value;
});

function route() {
  const h = location.hash.replace('#', '');
  const v = SEC[h] ? h : 'today';
  if (v !== ui.view) {
    ui.editing = ui.addSub = ui.dueMenu = ui.rowMenu = ui.renamingTab = null; ui.addingTab = false;
    if (SEC[v].tabs) ui.prefs.activeTab[v] = OVERVIEW;
  }
  ui.view = v;
  render();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

let lastDay = today();
function checkDay() {
  const td = today();
  if (td === lastDay) return;
  if (ui.weekStart === mondayOf(lastDay)) ui.weekStart = mondayOf(td);
  lastDay = td;
  if (canEdit()) rollRecurring();
  render();
}
setInterval(checkDay, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });

/* ================= start ================= */
ui.view = SEC[location.hash.replace('#', '')] ? location.hash.replace('#', '') : 'today';
SECTIONS.forEach(s => { if (s.tabs) ui.prefs.activeTab[s.id] = OVERVIEW; });
render();
initSync();
})();
</script>
</body>
</html>
